<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@font-face { font-family:'BodyFont'; src:url('https://raw.githubusercontent.com/lacepicnic/nemucity/main/rainyhearts.ttf') format('truetype'); }
:root {
  --txt:#c898ac; --txts:#d8b8c8; --head:#e8a0c0;
  --b:#f4cede; --b2:#f0b8d0; --dash:#f0c8d8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'BodyFont',sans-serif;
  font-size:14px;
  color:var(--txt);
  background:transparent;
  padding:12px 14px;
}
#HCB_comment_box * { font-family:'BodyFont',sans-serif !important; color:var(--txt) !important; }
#HCB_comment_box a { color:var(--b2) !important; }
#HCB_comment_box input,
#HCB_comment_box textarea {
  font-family:'BodyFont',sans-serif !important;
  border:1.5px dashed var(--dash) !important;
  border-radius:8px !important;
  background:#fffafe !important;
  color:var(--txt) !important;
  outline:none !important;
}
#HCB_comment_box input[type=submit],
#HCB_comment_box button {
  font-family:'BodyFont',sans-serif !important;
  border-radius:999px !important;
  border:1.5px dashed var(--dash) !important;
  background:#fff5fa !important;
  color:#c878a0 !important;
  cursor:pointer !important;
  transition:background .15s !important;
}
#HCB_comment_box input[type=submit]:hover,
#HCB_comment_box button:hover { background:#fde8f0 !important; }
#HCB_comment_box .hcb-need-comment-box,
#HCB_comment_box [class*="need-comment"] { display:none !important; }
#cc { position:fixed; inset:0; pointer-events:none; z-index:99999; }
#click-popup {
  position:fixed; display:none; z-index:9999999; pointer-events:none;
  font-family:'BodyFont',sans-serif; font-size:13px; color:#c878a0;
  white-space:nowrap; padding:6px 12px; background:#fffafd;
  border-width:5px; border-style:solid;
  border-image:url('https://raw.githubusercontent.com/lacepicnic/nemucity/main/lace-border1.png') 7 fill round;
  border-color:var(--b2);
  box-shadow:0 2px 10px rgba(200,100,140,.18);
}
</style>
</head>
<body>

<canvas id="cc"></canvas>

<!-- begin wwww.htmlcommentbox.com -->
<div id="HCB_comment_box"><a href="http://www.htmlcommentbox.com">Widget</a> is loading comments...</div>
<link rel="stylesheet" type="text/css" href="https://www.htmlcommentbox.com/static/skins/bootstrap/twitter-bootstrap.css?v=0" />
<script type="text/javascript" id="hcb"> /*<!--*/ if(!window.hcb_user){hcb_user={};} (function(){var s=document.createElement("script"), l=hcb_user.PAGE || (""+window.location).replace(/'/g,"%27"), h="https://www.htmlcommentbox.com";s.setAttribute("type","text/javascript");s.setAttribute("src", h+"/jread?page="+encodeURIComponent(l).replace("+","%2B")+"&mod=%241%24wq1rdBcg%24PTqIuCnoXJUhMVsieGWEv."+"&opts=16798&num=10&ts=1774727209530");if (typeof s!="undefined") document.getElementsByTagName("head")[0].appendChild(s);})(); /*-->*/ </script>
<!-- end www.htmlcommentbox.com -->

<div id="click-popup">do not steal !</div>

<script>
/* cursor cycling */
(function(){
  var base='https://raw.githubusercontent.com/lacepicnic/nemucity/main/';
  var frames=[base+'cursor-1.gif',base+'cursor-2.gif',base+'cursor-3.gif',base+'cursor-4.gif',base+'cursor-5.gif',base+'cursor-6.gif',base+'cursor-7.gif',base+'cursor-8.gif'];
  var fi=0,style=document.createElement('style');document.head.appendChild(style);
  function tick(){
    var url='url(\''+frames[fi]+'\'),auto';
    style.textContent='html,body,*:not(#HCB_comment_box):not(#HCB_comment_box *){cursor:'+url+'!important}';
    fi=(fi+1)%frames.length;
  }
  tick();setInterval(tick,120);
})();

/* sparkle */
(function(){
  var cv=document.getElementById('cc'),cx=cv.getContext('2d');
  function r(){cv.width=window.innerWidth;cv.height=window.innerHeight;}r();window.addEventListener('resize',r);
  var P=[],S=['\u2726','\u2727','\u22c6','\u00b7','\u2605'],C=['#ff9ec8','#ffb87a','#ffe56b','#8deba8','#7dd4f8','#b8a4ff','#ffaad4','#a8f0d0'];
  window.addEventListener('mousemove',function(e){P.push({x:e.clientX+(Math.random()-.5)*10,y:e.clientY+(Math.random()-.5)*10,vx:(Math.random()-.5)*.6,vy:Math.random()*1.4+.3,life:1,decay:Math.random()*.028+.018,size:Math.random()*7+4,char:S[Math.floor(Math.random()*S.length)],color:C[Math.floor(Math.random()*C.length)],rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.05});});
  function tick(){cx.clearRect(0,0,cv.width,cv.height);for(var i=P.length-1;i>=0;i--){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.rot+=p.rotV;p.life-=p.decay;if(p.life<=0){P.splice(i,1);continue;}cx.save();cx.globalAlpha=p.life*.9;cx.translate(p.x,p.y);cx.rotate(p.rot);cx.font=p.size+'px serif';cx.fillStyle=p.color;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.char,0,0);cx.restore();}requestAnimationFrame(tick);}
  tick();
})();

/* do not steal popup */
document.addEventListener('DOMContentLoaded',function(){
  var box=document.getElementById('click-popup');
  if(!box)return;
  var timer=null;
  function show(x,y){box.style.left=(x+8)+'px';box.style.top=(y-38)+'px';box.style.display='block';if(timer)clearTimeout(timer);timer=setTimeout(function(){box.style.display='none';},1400);}
  document.addEventListener('mousedown',function(e){if(e.button===2)show(e.clientX,e.clientY);});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
});
</script>
</body>
</html>
